update_notes: '시작: https://data.seoul.go.kr/dataList/datasetList.do?datasetKind=1&searchFlag=M
  . 검색어: 공공자전거 대여이력 / 공공자전거 대여소 / 상가 / 시설. 관측한 검색 폼은 POST이며 searchValue를 사용한다. 개발
  조회에서 datasetKind=1&searchValue={URL인코딩한 검색어} GET도 결과를 반환했으나 영구 API 계약은 아니다. 검색 결과의
  goView 요소 data-rel에 상세 경로가 있으므로 일반 href 목록의 추천·관련 항목을 검색 결과와 혼동하지 않는다. 생활·체류인구는
  홈페이지 서울빅데이터 메뉴로 이동하고 https://data.seoul.go.kr/dataVisual/seoul/seoulStay.do 에서 250m
  격자/5179 안내를 확인한다. API 사용 안내 https://data.seoul.go.kr/together/guide/useGuide.do
  는 인증키 발급 절차를 설명한다. 각 데이터 상세의 이용허락을 확인하고 ST-ID·시점·좌표계가 미확인이면 조인을 보류한다.'
