id: res_seoul_bike_station_master
name: 서울시 공공자전거 따릉이 대여소 마스터 정보
purpose: 따릉이 OD가 참조하는 공식 대여소 ID·주소·좌표 정보의 문서와 접근 경로를 확인한다
resource_type: dataset
source_url: https://data.seoul.go.kr/dataList/OA-21235/S/1/datasetView.do
status: active
category_ids:
- research
- spatial-analysis
scope: OA-21229 대여소별 대여/반납 승객수 설명에서 ID 정보 참조 대상으로 직접 연결한 OA-21235 메타정보. 공식 설명은 ID·주소·좌표
  제공을 명시한다. 실제 ST-* 값, 좌표계, 과거 기준시점 대응과 전체 데이터 품질은 이번에 미확인이다.
