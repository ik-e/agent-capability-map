update_notes: '선택 등록 이유: res_seoul_open_data_catalog 경유 개발 탐색에서 검색 결과의 data-rel 해석과
  OD별 마스터 구분에 추가 조회가 발생했다. 상위 포털의 전체 목록은 복제하지 않는다. OD 문서 https://data.seoul.go.kr/dataList/OA-21229/F/1/datasetView.do
  의 명시적 마스터 참조를 따른다. 대여소 일반 현황 OA-13252와 동일한 ID 체계라고 추정하지 않는다. 상세 접근은 공개이며 실제 API
  인증·실응답은 미검증. 상세는 공공누리 1유형(출처표시, 상업 이용 및 변경 가능)을 표시한다. 포털 관측 데이터 갱신일은 2026-11-03이고
  시점별 ID 유지 여부를 보증하지 않는다.'
