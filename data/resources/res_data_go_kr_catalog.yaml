update_notes: '탐색: 데이터목록에서 데이터명·기관·키워드로 검색한다. 홈페이지 SearchAction의 공식 경로 https://www.data.go.kr/tcs/dss/selectDataSetList.do?keyword={검색어}
  에 URL 인코딩한 검색어를 넣는다. 개발 조회어: 소상공인시장진흥공단 상가 상권정보. 상세에서 제공기관·기준일·좌표 설명·비용·이용허락범위를
  각각 확인한다. 이용가이드 https://www.data.go.kr/ugs/selectPublicDataUseGuideView.do 및 활용방법
  https://www.data.go.kr/ugs/selectPublicDataUseGuideMetView.do 참고. 목록 공개와 API 인증키/승인
  필요를 구분한다. 포털 전체에 동일한 이용조건을 적용하지 않는다.'
