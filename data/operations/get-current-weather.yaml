id: op_get_current_weather
name: 현재 날씨 조회
purpose: 위도와 경도에 해당하는 현재 날씨 정보를 조회합니다.
category_ids: [weather]
aliases: [current weather, temperature now, 현재 날씨, 현재 기온]
entity_types: [geographic-coordinate, weather-observation]
inputs:
  - name: latitude
    type: number
    required: true
    description: 십진 도 단위의 위도입니다.
  - name: longitude
    type: number
    required: true
    description: 십진 도 단위의 경도입니다.
outputs:
  - name: current
    type: object
    description: 제공자가 반환하는 현재 날씨 값입니다.
effect: read
status: active
