id: op_search_huggingface_models
name: Hub 모델 검색
purpose: Hugging Face Hub에서 검색어와 작업·라이브러리 필터로 모델 후보를 찾고 모델 메타데이터를 비교합니다.
category_ids: [model-discovery]
aliases: [search Hugging Face models, find an embedding model, discover models on the Hub]
entity_types: [machine-learning-model]
inputs:
  - name: search
    type: string
    required: false
    description: 모델 검색어입니다.
  - name: filter
    type: string
    required: false
    description: Hub가 지원하는 태스크·라이브러리 필터입니다.
outputs:
  - name: models
    type: array
    description: 검색 결과의 모델 식별자와 선택된 메타데이터입니다.
effect: read
status: active
