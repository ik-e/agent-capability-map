id: op_generate_model_response
name: 모델 응답 생성
purpose: 입력한 지시와 내용을 바탕으로 모델 응답을 생성합니다.
category_ids: [ai-generation]
aliases: [generate text with a model, create a model response]
entity_types: [model-response, text]
inputs:
  - name: model
    type: string
    required: true
    description: 제공자가 지원하는 모델 식별자입니다.
  - name: input
    type: string
    required: true
    description: 응답 생성에 사용할 입력 내용 또는 대화 항목입니다.
  - name: instructions
    type: string
    required: false
    description: 모델 응답 생성을 위한 선택적 상위 지시입니다.
outputs:
  - name: response
    type: object
    description: API가 반환하는 응답 객체입니다.
effect: none
status: active
