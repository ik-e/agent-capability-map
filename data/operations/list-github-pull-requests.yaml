id: op_list_github_pull_requests
name: GitHub 풀 리퀘스트 목록 조회
purpose: 지정한 GitHub 저장소의 풀 리퀘스트 목록을 조회합니다.
category_ids: [pull-requests]
aliases: [list PRs, repository pull requests, PR 목록]
entity_types: [repository, pull-request]
inputs:
  - name: owner
    type: string
    required: true
    description: 저장소 소유자의 로그인 이름입니다.
  - name: repo
    type: string
    required: true
    description: 저장소 이름입니다.
  - name: state
    type: string
    required: false
    description: 해당 엔드포인트가 지원하는 선택적 상태 필터입니다.
outputs:
  - name: pull_requests
    type: array
    description: 풀 리퀘스트 레코드 목록입니다.
effect: read
status: active
