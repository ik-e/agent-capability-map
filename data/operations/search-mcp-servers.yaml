id: op_search_mcp_servers
name: MCP 서버 메타데이터 검색
purpose: 공식 MCP Registry에서 게시된 서버 목록을 조건과 페이지 커서에 따라 찾아 연결 후보를 발견합니다.
category_ids: [mcp-discovery]
aliases: [discover MCP servers, search registry for MCP server, find an MCP integration]
entity_types: [mcp-server]
inputs:
  - name: search
    type: string
    required: false
    description: Registry가 지원하는 검색어입니다.
  - name: cursor
    type: string
    required: false
    description: 다음 페이지 조회에 사용하는 커서입니다.
outputs:
  - name: servers
    type: array
    description: 서버 메타데이터와 다음 페이지 커서를 포함한 결과입니다.
effect: read
status: active
