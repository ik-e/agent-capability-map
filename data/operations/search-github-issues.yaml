id: op_search_github_issues
name: GitHub 이슈 검색
purpose: GitHub 검색 한정자를 사용해 이슈와 풀 리퀘스트를 검색합니다.
category_ids: [issue-tracking]
aliases: [find GitHub issues, 이슈 검색, PR 검색]
entity_types: [issue, pull-request, repository]
inputs:
  - name: query
    type: string
    required: true
    description: 지원되는 한정자를 포함하는 GitHub 검색 질의입니다.
outputs:
  - name: items
    type: array
    description: 검색 조건에 맞는 이슈와 풀 리퀘스트 목록입니다.
effect: read
status: active
